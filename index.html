<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pync</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('https://github.com/qqqTppp/linkkingwithqueen/blob/4554ae62902527e740457e15775d87dd49e3282a/background.jpg?raw=true'); /* background image */
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent background for readability */
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 30px;
            color: #001f3f; /* or a hex code like #000080 navy*/
        }
        .logo {
            width: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
        }
        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin: 10px 0;
            background-color: #000080; /* old color is green #4CAF50 */
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            transition: background-color 0.3s;
        }
        .link i {
            margin-right: 10px;
            font-size: 20px;
        }
        .link:hover {
            background-color: #001a4d; /* slightly darker navy on hover, old is #45a049 */
        }
        .link:active {
            background-color: #000f33; /* even darker when clicked, old is #388e3c */
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://github.com/FerminPync/linkinall/blob/79ed040ac00ca5617d581a730133d5e0753db139/logoa.jpg?raw=true" alt="logo" class="logo"> <!--  logo URL -->
        <h1>Pync</h1>

        <a href="https://www.facebook.com/phucnguyen.qtp" class="link" target="_blank">
            <i class="fab fa-facebook"></i> Facebook
        </a>
        <a href="https://open.spotify.com/playlist/3FPVdGYCl1UDN2l7qqdJpy?si=b883fd6ac89b480e" class="link" target="_blank">
            <i class="fab fa-spotify"></i> Spotify
        </a>
        <a href="https://discord.com/invite/WJAMQ3H2" class="link" target="_blank">
            <i class="fab fa-discord"></i> Discord
        </a>
        <a href="https://cults3d.com/" class="link" target="_blank">
            <i class="fa-solid fa-cube"></i> Cults3D
        </a>
    </div>
</body>
</html>
